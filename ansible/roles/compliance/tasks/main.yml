---
- name: Créer le répertoire des spécifications
  ansible.builtin.file:
    path: "{{ goss_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Vérifier le cache Goss sur le contrôleur
  ansible.builtin.stat:
    path: "{{ goss_cache_path }}"
  register: goss_cache_stat
  delegate_to: localhost
  run_once: true
  become: false

- name: Télécharger Goss sur le contrôleur, version {{ goss_version }}
  ansible.builtin.get_url:
    url: "https://github.com/goss-org/goss/releases/download/{{ goss_version }}/goss-linux-amd64"
    dest: "{{ goss_cache_path }}"
    mode: "0644"
  when: not goss_cache_stat.stat.exists
  delegate_to: localhost
  run_once: true
  become: false

- name: Installer Goss {{ goss_version }}
  ansible.builtin.copy:
    src: "{{ goss_cache_path }}"
    dest: /usr/local/bin/goss
    owner: root
    group: root
    mode: "0755"

- name: Déposer les spécifications de conformité
  ansible.builtin.copy:
    src: "{{ goss_specs_src }}/{{ item }}"
    dest: "{{ goss_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ goss_specs }}"

- name: Générer les valeurs attendues pour cet environnement
  ansible.builtin.template:
    src: goss-vars.yaml.j2
    dest: "{{ goss_dir }}/vars.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Exécuter l'audit
  ansible.builtin.command:
    argv:
      - goss
      - --vars
      - "{{ goss_dir }}/vars.yaml"
      - --gossfile
      - "{{ goss_dir }}/{{ item }}"
      - validate
      - --max-concurrent
      - "1"
      - --format
      - documentation
      - --no-color
  loop: "{{ goss_specs }}"
  register: goss_results
  changed_when: false
  failed_when: false

- name: Verdict de conformité
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: |-
      {{ item.item }} : non conforme (rc={{ item.rc }})
      {{ item.stdout | default('') }}
      {{ item.stderr | default('') }}
    success_msg: "{{ item.item }} : conforme"
    quiet: false
  loop: "{{ goss_results.results }}"
  loop_control:
    label: "{{ item.item }}"
