---
# PSSI-01 : acces d'administration SSH
hardening_ssh_permit_root: "no"
hardening_ssh_password_auth: "no"
hardening_ssh_max_auth_tries: 4
hardening_ssh_allow_groups: [] # Liste vide : aucune restriction par groupe.

# PSSI-02 : parametres noyau.
# PSSI-07 (derogation) : net.ipv4.ip_forward reste a 1, indispensable au reseau
# de pods K3s. Ce parametre est volontairement absent de cette liste sysctl.
hardening_sysctl:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.tcp_syncookies: 1
  kernel.randomize_va_space: 2
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0

hardening_blacklisted_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - usb-storage

hardening_removed_packages:
  - telnet
  - rsh-client
  - nis

# PSSI-05 : filtrage reseau en liste blanche.
hardening_firewall_enabled: true
hardening_firewall_rules:
  - port: 22
    src: 192.168.56.10
    comment: "SSH depuis ctrl"
  - port: 22
    src: 10.0.2.0/24
    comment: "SSH Vagrant (interface NAT)"
  - port: 80
    src: 192.168.56.10
    comment: "HTTP depuis ctrl (smoke tests)"
  - port: 80
    src: 192.168.56.1
    comment: "HTTP depuis le poste hote"
  - port: 443
    src: 192.168.56.1
    comment: "HTTPS depuis le poste hote"
  - port: 6443
    src: 192.168.56.10
    comment: "API Kubernetes depuis ctrl uniquement"

hardening_k3s_cidrs:
  - 10.42.0.0/16
  - 10.43.0.0/16
