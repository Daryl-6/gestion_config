apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          page="$(wget -T 5 -t 1 -qO- http://{{ include "nova-hello.fullname" . }}:{{ .Values.service.port }}/)"
          printf '%s' "$page" | grep -Fq '<span class="env">{{ .Values.app.environment }}</span>'